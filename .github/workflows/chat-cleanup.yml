# GitHub Actions — daily chat cleanup
# Phase 8 — triggers cleanupExpiredChats Cloud Function once per day at 03:00 HKT.
# See functions/index.js for the function implementation.

name: Chat Cleanup (Phase 8)

on:
  schedule:
    # 03:00 HKT = 19:00 UTC (previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger cleanup Cloud Function
        env:
          FUNCTION_URL: ${{ secrets.CLEANUP_FUNCTION_URL }}
          CRON_SECRET: ${{ secrets.CLEANUP_CRON_SECRET }}
        run: |
          if [ -z "$FUNCTION_URL" ]; then
            echo "::error::CLEANUP_FUNCTION_URL secret not set"
            exit 1
          fi
          # Append ?secret=... so the function authorises the request
          URL="${FUNCTION_URL}?secret=${CRON_SECRET}"
          echo "Triggering: $FUNCTION_URL"
          HTTP_CODE=$(curl -sS -o /tmp/cleanup-response.json -w "%{http_code}" "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/cleanup-response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cleanup returned non-200"
            exit 1
          fi
